# LibreChat configuration - Ollama (running on the macOS host)
version: 1.3.17
cache: true

endpoints:
  # Requests go through ollama-proxy (converts PDF attachments for Ollama);
  # allow the private address through the SSRF guard
  allowedAddresses:
    - 'ollama-proxy:8080'
  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://ollama-proxy:8080/v1/"
      models:
        default:
          - "glm-ocr:latest"
        # Fetch the model list from Ollama automatically
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      summaryModel: "current_model"
      forcePrompt: false
      modelDisplayLabel: "Ollama"

fileConfig:
  endpoints:
    # ollama-proxy converts PDFs to images (vision/OCR models) or text
    Ollama:
      supportedMimeTypes:
        - "image/.*"
        - "application/pdf"
